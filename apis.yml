name: OpenToken
description: 'OpenToken (OpenToken Inc.) was a San Francisco based cryptocurrency
  startup founded in 2017 that operated a token-fundraising and token-project
  aggregation platform, generating a secure, per-buyer funding address for each
  contributor so token projects could collect and distribute assets during their
  sales. The company was backed by Bain Capital Ventures, Pantera Capital, and
  Moonwhale Ventures. It is no longer active: the opentoken.com domain is parked
  (it refuses HTTPS connections and resolves to OnlyDomains parking nameservers),
  and no public developer portal, API documentation, machine-readable API
  specification, or first-party SDK could be located for the company. This
  profile was surfaced as a portfolio company of Pantera Capital and remains a
  defunct-company record in the API Evangelist network; there is no live API
  surface to enrich.'
